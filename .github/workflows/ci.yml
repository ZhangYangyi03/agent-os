name: ci
on: [push, pull_request]
jobs:
  layers-and-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: every python file parses
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.py | ForEach-Object {
            python -c "import sys,py_compile;py_compile.compile(sys.argv[1],doraise=True)" $_.FullName
            if ($LASTEXITCODE -ne 0) { Write-Host "FAIL $($_.FullName)"; $bad = 1 }
          }
          if ($bad -ne 0) { exit 1 }
      - name: layer probe returns all nine layers
        run: |
          python layers.py > layers.json
          python -c "import json;d=json.load(open('layers.json'));assert len(d)==9,d.keys();print('ok',list(d))"
      - name: contract manifest has the four capabilities
        working-directory: anyapp
        run: |
          python demo.py > manifest.json
          python -c "import json;m=json.load(open('manifest.json'));names=sorted(x['name'] for x in m);assert names==['api.tags','app.classify','client.tabs','db.tables'],names;print('ok',names)"
      - name: control plane answers with numbers and refusal codes
        working-directory: kernel/control
        run: |
          python -c "import json,sys;sys.path.insert(0,'.');import l0ctl;r=l0ctl.process_reach();assert r['total']>0;assert r['readable']>0;print('ok',r['readable'],'/',r['total'])"
          python -c "import sys;sys.path.insert(0,'.');import l0ctl;s=l0ctl.service_control('wuauserv','stop');assert 'ok' in s;print('stop without elevation ->',s['ok'],s['exit'])"
      - name: os census reports a verdict for every object class it scanned
        working-directory: osctl
        run: |
          python osctl.py > census.json
          python -c "import json;c=json.load(open('census.json'));assert c['classes']>=10,c['classes'];assert c['actions_granted']>0;assert len(c['rows'])==c['classes'];[print(' ',r['class'],r['granted'],'/',r['granted']+r['refused']) for r in c['rows']];print('ok',c['classes'],'classes')"
      - name: a mutation that cannot be reverted is not reported as granted
        working-directory: osctl
        run: |
          python -c "import sys,os;sys.path.insert(0,'.');import osctl;r=osctl.file_write(os.path.join(os.environ.get('TEMP','.'),'af-ci-probe.txt'));assert r['result']['granted'] is True,r;print('write+read+delete ok')"
          python -c "import sys,os;sys.path.insert(0,'.');import osctl;r=osctl.registry_probe('HKCU','Software\\af-ci-%d'%os.getpid());assert r['result']['granted'] is True,r;print('hkcu ok')"
      - name: microcode distance is measured as named gates, not a claim
        working-directory: kernel/control
        run: |
          python -c "import json,sys;sys.path.insert(0,'.');import l0reach;d=l0reach.distance();assert d['gates_total']==5;assert 0<=d['gates_met']<=5;print('gates',d['gates_met'],'/',d['gates_total']);[print(' ',g['met'],g['gate'][:60]) for g in d['gates']]"
      - name: census runs and reports a verdict for every app it scanned
        working-directory: anyapp
        run: |
          python census.py --quick > census.json
          python -c "import json;c=json.load(open('census.json'));assert c['apps_scanned']>0;assert sum(c['verdicts'].values())==c['apps_scanned'],c['verdicts'];print('ok',c['apps_scanned'],c['verdicts'])"
      - name: an HTML page on an API port is not counted as a contract
        working-directory: anyapp
        run: python test_census.py
      - name: db.tables works on a synthetic sqlite file
        working-directory: anyapp
        run: |
          python -c "import sqlite3;c=sqlite3.connect('t.db');c.execute('create table a(x)');c.execute('create table b(y)');c.commit()"
          python -c "import sys;sys.path.insert(0,'.');from demo import reg;print(reg.call('db.tables',path='t.db'))"
